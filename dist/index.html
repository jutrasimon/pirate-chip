<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#092331"><meta name="description" content="A tactile pirate duel with double-sided coins."><title>Coin Pouch · Flibuste Pop</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game"><section class="arena" aria-label="Enemy">
<header><div class="enemy-hud"><h1 id="enemy-name">The Captain</h1><div id="enemy-shield" class="shield-badge" hidden role="status" aria-label="Enemy block"><svg viewBox="0 0 50 58" aria-hidden="true"><path d="M25 3C18 8 10 9 4 9v18c0 12 8 21 21 28 13-7 21-16 21-28V9c-6 0-14-1-21-6Z" fill="#79bdd9" stroke="#071f2e" stroke-width="4"/><path d="M25 9v39c10-6 15-13 15-22V14c-5 0-10-2-15-5Z" fill="#3b8fb4"/></svg><b id="enemy-block">0</b></div><div class="enemy-title"><div class="health"><div id="enemy-bar"></div></div><span id="enemy-health">30 / 30</span></div></div><div class="header-buttons"><button id="help" class="icon-button" aria-label="Settings">⚙</button></div></header>
<div class="encounter"><span id="battle-count">BATTLE 1 / 5</span></div>
<div id="enemy" class="enemy" data-pose="idle"><img class="pirate-sprite idle" src="pirate-idle.png" alt="Pirate captain in a yellow coat, idle" draggable="false"><img class="pirate-sprite attack" src="pirate-attack.png" alt="" draggable="false" aria-hidden="true"><img class="pirate-sprite hurt" src="pirate-hurt.png" alt="" draggable="false" aria-hidden="true"></div>
<button id="intent" class="intent" aria-label="Next intent"></button><button id="enemy-status" hidden aria-label="Enemy status details"></button><div id="turn-banner" role="status" aria-live="polite" hidden></div><div id="scene-loading" hidden><span id="loading-copy">Preparing encounter…</span><button id="retry-scene" hidden>Retry</button></div><div id="slash" aria-hidden="true"></div>
</section>
<section class="play"><div id="coins" class="coins"></div><div class="turn-controls"><span class="actions"><b id="actions">● ●</b><span id="action-count">2 actions</span><small id="next-actions" hidden></small></span><button id="inventory-open" class="pouch-button" aria-label="Open coin pouch">◈<small>POUCH</small></button><button id="end" class="primary">End turn</button></div>
<div class="player-strip"><span class="player-life"><span class="heart">♥</span> <b id="player-health">28</b><small>/ 28</small></span><div id="player-shield" class="shield-badge" hidden role="status" aria-label="Player block"><svg viewBox="0 0 50 58" aria-hidden="true"><path d="M25 3C18 8 10 9 4 9v18c0 12 8 21 21 28 13-7 21-16 21-28V9c-6 0-14-1-21-6Z" fill="#79bdd9" stroke="#071f2e" stroke-width="4"/><path d="M25 9v39c10-6 15-13 15-22V14c-5 0-10-2-15-5Z" fill="#3b8fb4"/></svg><b id="player-block">0</b></div><div class="player-bar"><i id="player-bar"></i></div></div></section></main>
<canvas id="particles" aria-hidden="true"></canvas><div id="flash" aria-hidden="true"></div><div id="enemy-impact" aria-hidden="true"></div><div id="tooltip" role="tooltip" hidden></div>
<dialog id="peek"><button class="close" aria-label="Close">×</button><h2 id="peek-name"></h2><div id="peek-faces"></div><button class="primary close-peek">Close</button></dialog>
<dialog id="instructions"><button class="close" aria-label="Close">×</button><span class="eyebrow">FLIBUSTE POP</span><h2>Settings</h2><div class="audio-settings"><button id="sounds-toggle" role="switch" aria-checked="true"><span>SOUNDS</span><b>ON</b></button><button id="music-toggle" role="switch" aria-checked="true"><span>MUSIC</span><b>ON</b></button></div><div class="lab"><span>IMPACTS</span><div role="group" aria-label="Impact intensity"><button data-level="2" aria-pressed="true" class="selected">Explosive</button><button data-level="3" aria-pressed="false">Tempest</button></div><button id="reset" aria-label="Restart run">↻</button></div><button class="primary close-help">Resume</button></dialog>
<dialog id="result"><span class="eyebrow" id="result-label">ENEMY DEFEATED</span><h2 id="result-title"></h2><p id="result-story"></p><p id="result-summary"></p><button class="primary" id="again">Next battle</button></dialog><dialog id="pouch" class="pouch-dialog"><button class="close" aria-label="Close pouch">×</button><span class="eyebrow" id="pouch-kicker">YOUR COLLECTION</span><h2 id="pouch-title">Coin pouch</h2><p id="pouch-context"></p><div id="pool-grid"></div><div id="forge-confirm" hidden><p id="forge-description"></p><button class="primary" id="forge-apply">Forge this face</button></div></dialog>
<dialog id="rewards"><span class="eyebrow">SPOILS OF VICTORY</span><h2>A little more dangerous.</h2><p>Choose one upgrade. Forge it onto an empty face.</p><div id="reward-options"></div></dialog>
<script type="module" src="game.js"></script></body></html>
